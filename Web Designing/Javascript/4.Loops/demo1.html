<!---example showing the concept of loops-->
<script>
    /*
    5    x   1   = 5
    5    x   2   = 10
    |        |      |

    5    x   i  =  t

    */

   var num = parseInt(prompt("Enter the number :"));
     for(var  i =1; i<=10;i++){
      
       document.write(num+" x "+i+" = "+(num*i)+" <br>");
     }
</script>
