<script>

     var num = prompt("Enter number");
    var i = 1;//initialization
    document.write("<h2> Series</h2>");
    while(i<=num)//condition
    {
        //statement
        if(i%2==0)
        document.write("&nbsp;&nbsp;&nbsp;&nbsp;"+"even");
    else
    document.write("&nbsp;&nbsp;&nbsp;&nbsp;"+"odd");
        i++;
    }
</script>
