<script>
    var num = parseInt(prompt("Enter the even number:"));
    var n = parseInt(prompt("How many numbers do you want to print?"));

    for (var i = 1; i <= n; i++) {
        document.write(num * i + "&nbsp;&nbsp;&nbsp;");
    }
</script>
