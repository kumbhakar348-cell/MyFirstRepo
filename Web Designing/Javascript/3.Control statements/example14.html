<!--  Switch control statement-  it is mainly use to work with -->

<script>
    //switch (constant | variable | expressin  aa skte h condition  ni aaygi)
    switch(4){
        case 1 :document.write("<br>statement 1");
                break;
        case 2 :document.write("<br>statement 2");
                break;
        case 3 :document.write("<br>statement 3");
                break;
        case 4 :document.write("<br>statement 4");
                break;
        case 5 :document.write("<br>statement 5");
                break;
        default  :document.write("<br>Invalid selection ");
                break;
    }
    </script>
