<!--------------Relational operator-->
<script>
    var a = 100;
    var b = 300;

    document.writeln(a+" < "+b+" = "+(a<b)+"<br>");
    document.writeln(a+" > "+b+" = "+(a>b)+"<br>");
    document.writeln(a+" <= "+b+" = "+(a<=b)+"<br>");
    document.writeln(a+" >= "+b+" = "+(a>=b)+"<br>");
    document.writeln(a+"  == "+b+" = "+(a==b)+"<br>");
    document.writeln(a+" != "+b+" = "+(a!=b)+"<br>");
    document.writeln(a+" === "+b+" = "+(a===b)+"<br>");

</script>
