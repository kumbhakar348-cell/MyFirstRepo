<!--------------Relational operator-->
<script>
    var a = 100;//typeof a  = number
    var b = "300";//typeof b = string

    document.writeln(a+" + "+b+" = "+(a+b)+"<br>");
    document.writeln(a+" - "+b+" = "+(a-b)+"<br>");
    document.writeln(a+" * "+b+" = "+(a*b)+"<br>");
    document.writeln(a+" / "+b+" = "+(a/b)+"<br>");
    document.writeln(a+"  % "+b+" = "+(a%b)+"<br>");
  
</script>
