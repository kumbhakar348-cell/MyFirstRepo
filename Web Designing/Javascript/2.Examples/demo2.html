<!--------------Relational operator-->
<script>
    var a = 100;
    var b = "100";

   document.write("value of a : ",a);
   document.write("<br>typeof a: "+typeof(a));
   document.write("<br>value of b :"+b);
   document.write("<br>typeof b :"+typeof b+"<br><br><br>");



    document.writeln(a+"  == "+b+" = "+(a==b)+"[== check value ]<br>");
    document.writeln(a+" === "+b+" = "+(a===b)+"[=== checks value and type both]<br>");

</script>
