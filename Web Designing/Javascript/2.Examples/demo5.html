<!---Type Coercian-->

 
<script>
    // ye ek type ko dusre type me convert krne ka kam krta h
  //number to string        me conversion ho rha h..
    var a = '100' + 5;
    
    document.write("value of a : "+a);
    document.write("<br>typeof a :"+typeof a);

    //string to number
     var b = '100' - 5;
    document.write("<br><br>value of a : "+b);
    document.write("<br>typeof b :"+typeof b);

    //boolean to number
     var c = true + 5;
    document.write("<br><br>value of c : "+c);
    document.write("<br>typeof c :"+typeof c);

     var d = false + 5;
    document.write("<br><br>value of c : "+d);
    document.write("<br>typeof d :"+typeof d);
  
  //equality

  var x = 100;
  var y = "100";
  document.write("<br><br>x==y :",x==y);
</script>
