<script>
    var a = 1;
    var b = 3;
    var c = 7;

    var avg = (a+b+c)/3;
    document.write("<br>average :"+avg);
    document.write("<br>average :"+avg.toPrecision(3));
    document.write("<br>average : "+avg.toFixed(3));

    document.write("<br>power :"+Math.pow(2,5));
    document.write("<br>square root :"+Math.sqrt(2));
    document.write("<br>square root :"+Math.sqrt(2).toFixed(4));
    document.write("<br>absolute value :"+Math.abs(-45));
    document.write("<br>absolute value :"+Math.abs(45));
</script>
